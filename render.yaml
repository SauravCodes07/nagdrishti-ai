services:
  - type: web
    name: nagdrishti-backend
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: starter
    region: singapore
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: "nagdrishti-ai-backend.onrender.com,nagdrishti-backend.onrender.com,.onrender.com,localhost,127.0.0.1"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://nagdrishti-ai-backend.onrender.com,https://nagdrishti-backend.onrender.com,https://nagdrishti-ai.vercel.app,https://nagdrishti.netlify.app,http://localhost:3000"
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_NAME
        value: postgres
      - key: SUPABASE_DB_USER
        value: postgres
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: SUPABASE_DB_PORT
        value: "5432"
      - key: HUGGINGFACE_API_TOKEN
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: TWILIO_TO_NUMBER
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: "http://localhost:3000,https://nagdrishti-ai.vercel.app,https://nagdrishti.netlify.app"

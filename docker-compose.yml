version: '3.8'

services:
  # 1. Frontend Vite React SPA
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:80"
    environment:
      - VITE_BACKEND_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

  # 2. FastAPI Python GeoAI Backend
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/nagdrishti
      - REDIS_URL=redis://redis:6379/0
      - EARTH_ENGINE_PROJECT=nagdrishti-ai-geospatial
    depends_on:
      - db
      - redis
    restart: unless-stopped

  # 3. PostgreSQL 16 with PostGIS 3.4
  db:
    image: postgis/postgis:16-3.4-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=nagdrishti
    volumes:
      - postgis_data:/var/lib/postgresql/data
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    restart: unless-stopped

  # 4. Redis Caching Service
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgis_data:
  redis_data:
